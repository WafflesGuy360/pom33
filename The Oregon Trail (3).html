<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Oregon Trail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{--bg:#f1e4c3;--pn:#fff8e6;--tx:#3a2a14;--bd:#7a5a2e;--bt:#e8c77a;--gd:#2f7a2f;--bad:#a02020;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1710;--pn:#2b2216;--tx:#f0e2c2;--bd:#8a6a3a;--bt:#5a4524;--gd:#5cbf5c;--bad:#ff8a7a}}
:root[data-theme="dark"]{--bg:#1d1710;--pn:#2b2216;--tx:#f0e2c2;--bd:#8a6a3a;--bt:#5a4524;--gd:#5cbf5c;--bad:#ff8a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:21px/1.3 "VT323","Courier New",monospace}
#w{max-width:760px;margin:0 auto;padding:10px}
h1{margin:6px 0;font:18px/1.4 "Press Start 2P","Courier New",monospace;letter-spacing:1px}
canvas{width:100%;height:auto;border:4px solid var(--bd);border-radius:0;display:block;image-rendering:crisp-edges;image-rendering:pixelated;box-shadow:4px 4px 0 var(--bd)}
#hud,#ui,#pty{background:var(--pn);border:4px solid var(--bd);border-radius:0;box-shadow:4px 4px 0 var(--bd);padding:8px 12px;margin-top:10px}
#hud div{margin:2px 0;font-size:19px}
#pty{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;font-size:18px}
#pty:empty{display:none}
.pp.dead{opacity:.45;text-decoration:line-through}
.pp i{display:block;height:10px;background:rgba(128,128,128,.35);border:2px solid var(--bd);border-radius:0;overflow:hidden}
.pp u{display:block;height:100%}
button{font:inherit;background:var(--bt);color:var(--tx);border:3px solid var(--bd);border-radius:0;box-shadow:3px 3px 0 var(--bd);padding:5px 12px;margin:4px;cursor:pointer}
button:hover{filter:brightness(1.12)}
input{font:inherit;padding:4px;margin:6px 0;border:3px solid var(--bd);border-radius:0;background:var(--bg);color:var(--tx)}
.lg{color:var(--bad);font-style:italic}
.row{display:flex;align-items:center;gap:4px}.row span{flex:1}
#ui p{margin:4px 0 8px}
#pg{height:14px;border:4px solid var(--bd);background:var(--pn);margin-top:10px;box-shadow:4px 4px 0 var(--bd)}#pg u{display:block;height:100%;background:var(--gd);transition:width .3s}
#mu{float:right;font-size:16px;margin:0}canvas{cursor:crosshair}
@keyframes sk{25%{transform:translate(-6px,3px)}75%{transform:translate(6px,-3px)}}.sk{animation:sk .3s}
#ui{counter-reset:b}#ui>button{counter-increment:b}#ui>button::before{content:counter(b) ". ";opacity:.6}
</style></head><body>
<div id="w"><h1>🐂 The Oregon Trail <button id="mu" title="Sound on/off">🔊</button></h1>
<canvas id="c" width="180" height="65"></canvas>
<div id="pg"><u></u></div><div id="hud"></div><div id="pty"></div><div id="ui"></div></div>
<script>
const $=i=>document.getElementById(i),R=n=>Math.floor(Math.random()*n),pk=a=>a[R(a.length)],ch=p=>Math.random()<p;
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],PN=["Steady","Strenuous","Grueling"],RN=["Filling","Meager","Bare bones"];
const LM=[["Kansas River",102,"r"],["Big Blue River",185,"r"],["Fort Kearny",304,"f"],["Chimney Rock",554,"l"],["Fort Laramie",640,"f"],["Independence Rock",830,"l"],["South Pass",932,"l"],["Fort Bridger",989,"f"],["Soda Springs",1151,"l"],["Fort Hall",1288,"f"],["Snake River",1451,"r"],["Fort Boise",1534,"f"],["The Blue Mountains",1648,"l"],["Fort Walla Walla",1736,"f"],["The Dalles",1800,"d"]];
const END=2600,U={food:50,ammo:1,clothes:1,parts:1,med:1,ox:1},PR={food:10,ammo:4,clothes:10,parts:12,med:8,ox:30};
const NM={food:"lb of food",ammo:"boxes of ammo",clothes:"sets of clothes",parts:"spare parts",med:"doses of medicine",ox:"oxen"};
const WS={snow:.55,thunderstorm:.6,rain:.8,fog:.85,freezing:.8,windy:.9,"very hot":.8,hot:.9};
const DIS=[["dysentery",9],["cholera",13],["typhoid",8],["measles",6],["a fever",5],["snakebite",10],["exhaustion",5],["mountain fever",7],["scurvy",5],["a broken arm",4],["a broken leg",7],["an infected wound",8],["food poisoning",5],["a bad cough",4],["frostbite",7],["heat stroke",7]];
let G,P=[],tr=0,fr=0;
const A=()=>P.filter(p=>!p.x),lose=(k,n)=>{G[k]=Math.max(0,G[k]-n)},adv=n=>{for(let i=0;i<n;i++)day(1)};
const fd=()=>MO[G.d.getMonth()]+" "+G.d.getDate()+", "+G.d.getFullYear();
function newG(){G={mi:0,d:new Date(1848,2,1),food:0,ammo:0,clothes:0,parts:0,med:0,ox:0,money:0,pace:0,rat:0,w:"clear",T:60,run:0,nl:0,log:[],msg:"",ret:null,mult:1,at:0};P=[]}
function hurt(p,n,c){if(p.x)return;p.h-=n;if(p.h<=0){p.h=0;p.x=1;G.log.push(`${p.n} has died of ${c||p.ill||"exhaustion"}.`)}}
function wx(){const m=G.d.getMonth(),h=G.mi>1950||(G.mi>1150&&G.mi<1300),r=Math.random(),T=[22,28,40,52,62,72,80,78,66,52,36,26][m]-(h?10:0)+R(16)-8;G.T=T;G.w=T<28?(r<.5?"snow":"freezing"):r<.12?"rain":r<.18?"thunderstorm":r<.25?"fog":T>88?"very hot":T>75&&r<.6?"hot":pk(["clear","clear","clear","cool","windy","cloudy"])}
function day(rest){const a=A(),n=a.length;G.d.setDate(G.d.getDate()+1);wx();
 if(!rest)G.mi+=Math.max(0,[11,15,20][G.pace]*Math.min(1,G.ox/4)*(WS[G.w]||1))+R(4);
 G.food-=Math.ceil([2.4,1.8,1.3][G.rat]*n);let st=0;if(G.food<0){G.food=0;st=1}
 a.forEach(p=>{const d=[1,0,-2][G.rat]+(rest?3:[0,-1,-3][G.pace])-(p.ill?Math.ceil(p.sv/2):0)-(G.T<35&&G.clothes<n?2:0)-(G.T>90?1:0)-(st?5:0);
  if(d<0)hurt(p,-d,st?"starvation":p.ill||(G.T<35?"exposure":"exhaustion"));else p.h=Math.min(100,p.h+d);
  if(p.ill&&!p.x&&--p.t<=0){G.log.push(p.n+" has recovered from "+p.ill+".");p.ill=0;p.sv=0}})}
function hud(){const g=G,l=LM[g.nl];$('hud').innerHTML=`<div><b>${fd()}</b> · ${g.w}, ${g.T}°F</div><div>Miles to Oregon: <b>${Math.max(0,END-Math.floor(g.mi))}</b> · Next stop: ${l?l[0]+" ("+(l[1]-Math.floor(g.mi))+" mi)":"the Willamette Valley"}</div><div>Food <b>${g.food}</b> lb (~${Math.floor(g.food/Math.max(1,cn()))} days) · Oxen <b>${g.ox}</b> · Ammo <b>${g.ammo}</b> · Clothes <b>${g.clothes}</b> · Parts <b>${g.parts}</b> · Medicine <b>${g.med}</b> · $<b>${g.money}</b></div><div>Pace: ${PN[g.pace]} · Rations: ${RN[g.rat]}</div>`;
 $('pty').innerHTML=P.map(p=>`<div class="pp${p.x?" dead":""}"><span>${p.x?"✝ ":""}${p.n}${p.ill&&!p.x?" ("+p.ill+")":""}</span><i><u style="width:${p.h}%;background:${p.h>60?"var(--gd)":p.h>30?"#d08a1a":"var(--bad)"}"></u></i></div>`).join("")}
function ask(t,o){G.run=0;if(P.length&&(P[0].x||!A().length))return over();hud();const l=G.log.splice(0).join(" "),u=$('ui');u.innerHTML=(l?`<p class="lg">${l}</p>`:"")+`<p>${t}</p>`;
 o.forEach(([s,f])=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>{const r=f();if(r!=null)done(r)};u.appendChild(b)})}
function done(t){ask(t,[["Continue",G.ret||go]])}
function go(){G.run=1;G.msg="";G.ret=null;G.at=0;const u=$('ui');u.innerHTML="<p>The wagon rolls westward…</p>";const b=document.createElement('button');b.textContent="Stop the wagon / manage supplies";b.onclick=()=>{G.run=0;menu()};u.appendChild(b)}
function menu(x){x=x||[];G.run=0;G.ret=()=>menu(x);ask(G.msg||"The wagon is stopped. What would you like to do?",[["Continue traveling",go],["Rest 2 days",()=>{adv(2);menu(x)}],["Hunt (1 day)",hunt],["Pace: "+PN[G.pace]+" ›",()=>{G.pace=(G.pace+1)%3;menu(x)}],["Rations: "+RN[G.rat]+" ›",()=>{G.rat=(G.rat+1)%3;menu(x)}],...x])}
function over(w){G.run=0;hud();const l=G.log.splice(0).join(" ");$('ui').innerHTML=`<p class="lg">${l}</p><p><b>Your journey ends here.</b> ${w||(P[0].x?"Wagon leader "+P[0].n+" has perished.":"Everyone has died.")} You traveled ${Math.floor(G.mi)} of 2,600 miles. Tombstone: <i>“Here lies ${P[0].n}. Died on the trail, ${fd()}.”</i></p>`;ag()}
function ag(){const b=document.createElement('button');b.textContent="Start a new journey";b.onclick=intro;$('ui').appendChild(b)}
function win(m){G.run=0;if(P[0].x||!A().length)return over();const a=A(),s=Math.round((a.length*100+a.reduce((t,p)=>t+p.h,0)/2+G.food/5+G.ox*10+G.clothes*5+G.parts*5+G.med*3+G.ammo*2+G.money/5)*G.mult);hud();const l=G.log.splice(0).join(" ");$('ui').innerHTML=`<p class="lg">${l}</p><p><b>🎉 You made it to Oregon!</b> ${m||""} You arrived on ${fd()} with ${a.length} of ${P.length} family members alive. Final score: <b>${s}</b>.</p>`;ag()}
function intro(){newG();ask(`<b>THE OREGON TRAIL — 1848</b><br>You will lead a party of five (more may join along the way) 2,600 miles from Independence, Missouri to Oregon’s Willamette Valley. Choose names for your wagon leader and four companions. Leave a companion name blank to use a random name.<br><label for="nm">Wagon leader</label><br><input id="nm" value="Josiah" maxlength="14"><br><label for="comp1">Companion 1</label><br><input id="comp1" placeholder="Random name" maxlength="14"><br><label for="comp2">Companion 2</label><br><input id="comp2" placeholder="Random name" maxlength="14"><br><label for="comp3">Companion 3</label><br><input id="comp3" placeholder="Random name" maxlength="14"><br><label for="comp4">Companion 4</label><br><input id="comp4" placeholder="Random name" maxlength="14"><br>Choose a trade (poorer trades score higher):`,[["Banker — $1,100 (×1)",()=>pick(1100,1)],["Carpenter — $550 (×2)",()=>pick(550,2)],["Farmer — $280 (×3)",()=>pick(280,3)]])}
function pick(m,x){const cleanName=(v,fallback)=>{const s=(v||"").trim().replace(/[<>&"]/g,"").slice(0,14);return s||fallback};const n=cleanName($('nm').value,"Josiah"),ns=["Sarah","Thomas","Eliza","William","Martha","Henry","Clara","Amos"].sort(()=>Math.random()-.5),companions=Array.from({length:psz()},(_,i)=>i+1).map((i)=>cleanName($('comp'+i).value,ns[i-1]));
 P=[n,...companions].map(n=>({n,h:100,ill:0,sv:0,t:0}));G.money=m;G.mult=x;const H=["muddy, little grass","wet spring","the ideal time","dry and dusty","risk of mountain snow!"];
 ask("When do you leave Independence?",[2,3,4,5,6].map(i=>[MO[i]+" 1 ("+H[i-2]+")",()=>{G.d=new Date(1848,i,1);shop(1,begin)}]))}
function begin(){if(G.ox<2){shop(1,begin);$('ui').insertAdjacentHTML('afterbegin','<p class="lg">You need at least 2 oxen to pull a wagon!</p>');return}go()}
function shop(m,after){
 const c={},ks=Object.keys(U),prices={};
 ks.forEach(k=>prices[k]=Math.round(PR[k]*m));
 const u=$('ui');
 G.run=0;hud();
 u.innerHTML=`<p>The general store. You have $${G.money}. Type how many bundles or items you want to buy. Food is sold in 50-lb bundles.</p>`;
 const rows={};
 ks.forEach(k=>{
  const d=document.createElement('div');d.className='row';
  const label=document.createElement('span');
  label.textContent=`${k==="food"?"50-lb food bundles":NM[k]} ($${prices[k]} each)`;
  const input=document.createElement('input');input.type='number';input.min='0';input.step='1';input.value='0';input.inputMode='numeric';input.style.width='76px';input.setAttribute('aria-label',`Quantity of ${NM[k]} to buy`);
  const stock=document.createElement('b');stock.textContent=String(G[k]);
  input.addEventListener('input',()=>{
   const n=Math.max(0,Math.floor(Number(input.value)||0));
   c[k]=n;stock.textContent=String(G[k]+n*U[k]);updateTotal();
  });
  d.append(label,input,stock);u.appendChild(d);rows[k]={input,stock};
 });
 const summary=document.createElement('p');summary.id='shopSummary';u.appendChild(summary);
 const b=document.createElement('button');b.textContent='Done shopping';b.onclick=()=>{
  const cost=ks.reduce((sum,k)=>sum+(c[k]||0)*prices[k],0);
  if(cost>G.money){summary.textContent=`You are $${cost-G.money} over budget. Lower some quantities to continue.`;return}
  ks.forEach(k=>G[k]+=(c[k]||0)*U[k]);G.money-=cost;after();
 };u.appendChild(b);
 function updateTotal(){
  const cost=ks.reduce((sum,k)=>sum+(c[k]||0)*prices[k],0);
  summary.textContent=`Total: $${cost} · Money remaining: $${G.money-cost}`;
  summary.style.color=cost>G.money?'#c44':'';
 }
 updateTotal();
}
function land(l){G.at=l[2];const n=l[0];if(l[2]=="r")return river(n,`You have reached the ${n}. `);if(l[2]=="d")return dalles("");
 G.msg=`You have reached ${n}. `+(l[2]=="f"?"A trading post stands behind a log stockade. Prices rise the farther west you go. ":"")+(n=="Independence Rock"?(G.d.getMonth()<6||(G.d.getMonth()==6&&G.d.getDate()<=4)?"You’re ahead of the Fourth of July schedule!":"You’re behind schedule. Mountain snow is a real danger."):"");
 const fx=l[2]=="f"?[["Visit the store",()=>shop(1+l[1]/900,()=>menu(fx))]]:[];menu(fx)}
function swim(r){if(!ch(r/100))return "You cross safely.";const f=Math.round(G.food*(.2+Math.random()*.4));lose("food",f);lose("clothes",R(2));lose("ammo",R(2));if(ch(.4))lose("ox",1);A().forEach(p=>{if(ch(.1))hurt(p,100,"drowning")});return `Disaster! The wagon is swamped. You lose ${f} lb of food and other supplies.`}
function river(n,pre){const d=2+R(7)+(/rain|thunder/.test(G.w)?2:0);ask(`${pre||""}The river is about ${d} feet deep and ${100+R(300)} feet wide. How will you cross? (Fording is only safe in shallow water; the ferry is safest.)`,[["Ford it",()=>swim(Math.max(4,Math.min(85,(d-2)*13)))],["Caulk the wagon and float it",()=>swim(8+d*3)],["Hire a ferry ($10, 1 day)",()=>{if(G.money<10){river(n,"You can’t afford the ferry! ");return}G.money-=10;adv(1);return swim(3)}],["Wait a day for the water to change",()=>{adv(1);river(n,"A day passes. ")}]])}
function dalles(pre){ask(`${pre}You have reached The Dalles, the end of the wagon road. You can raft the wild Columbia River, or take the new Barlow Road over the mountains for a $25 toll.`,[["Raft the Columbia",()=>{let m="";for(let i=0;i<3;i++)if(ch(.28)){m+="Rapids toss the raft! ";lose("food",50+R(80));const p=pk(A());ch(.35)?hurt(p,100,"drowning"):hurt(p,25,"injuries")}G.mi=END;adv(4);win(m)}],["Take the Barlow Road ($25)",()=>{if(G.money<25){dalles("You can’t afford the toll! ");return}G.money-=25;G.mi=2351;return "You pay the toll and start up the steep, muddy road. Expect hardships."}]])}
function sick(p,d,s){if(!p)return;p.ill=d;p.sv=s;p.t=4+R(6)}
function sickEv(p,d,s){ask(`${p.n} has ${d}.`,[["Use medicine",()=>{if(!G.med){sick(p,d,s);return "You have no medicine! "+p.n+" suffers on."}G.med--;if(ch(.8))return p.n+" recovers quickly thanks to the medicine.";sick(p,d,s/2);return "The medicine helps only a little."}],["Rest 3 days",()=>{sick(p,d,s);adv(3);if(!p.x&&ch(.45)){p.ill=0;p.sv=0;return "Rest does the trick. "+p.n+" is on the mend."}return "Three days pass. "+p.n+" is still unwell."}],["Push on and pray",()=>{sick(p,d,s);return "You press on. "+p.n+" rides in the wagon bed, suffering."}]])}
function hunt(){const a=pk([["buffalo",300],["deer",100],["antelope",80],["elk",180],["rabbits",14],["a black bear",160]]);ask(`You spot ${a[0]} near camp.`,[["Aim carefully (1 box)",()=>shot(a,1,.65)],["Blaze away (3 boxes)",()=>shot(a,3,.92)],["Let it go",()=>"You let it be."]])}
function shot(a,b,p){if(G.ammo<b)return "You don’t have enough ammo.";G.ammo-=b;adv(1);if(!ch(p))return "You miss. It gets away.";const f=Math.min(200,Math.round(a[1]*(.7+Math.random()*.6)));G.food+=f;if(a[0].includes("bear")&&ch(.25)){hurt(pk(A()),20,"a mauling");return `You bring down the bear (+${f} lb) but it claws someone first.`}return `Success! You haul back ${f} lb of meat (all you can carry).`}
const E=[
{w:16,f(){const x=pk(DIS.filter(d=>!(d[0]=="frostbite"&&G.T>40)&&!(d[0]=="heat stroke"&&G.T<80)));sickEv(pk(A()),x[0],x[1])}},
{w:10,f(){const x=pk(["wheel","axle","tongue"]);ask(`A ${x} on the wagon has cracked.`,[["Use a spare part",()=>{if(G.parts){G.parts--;return "You fit a spare. Good as new."}adv(3);return "No spares! You spend 3 days whittling a crude replacement."}],["Patch it by hand (2 days)",()=>{adv(2);if(ch(.6))return "The patch holds, for now.";adv(2);return "The patch fails. You lose two more days redoing it."}]])}},
{w:7,ok:()=>G.ox>0,f(){ask(`One of your oxen ${pk(["went lame","collapsed from the heat","ate a poison weed","was bitten by a snake","broke a leg in a gopher hole"])}.`,[["Butcher it (+120 lb food)",()=>{lose("ox",1);G.food+=120;return "Fresh meat tonight."}],["Nurse it (2 days)",()=>{adv(2);if(ch(.55))return "The ox recovers.";lose("ox",1);return "It dies despite your care."}],["Leave it behind",()=>{lose("ox",1);return "You unyoke it and walk on."}]])}},
{w:8,f(){const s=pk([["thunderstorm","food"],["hailstorm","clothes"],["dust storm","ammo"],["flash flood","food"],["blizzard","clothes"],["prairie fire","food"]]),n=s[0],k=s[1];ask(`A ${n} sweeps over the trail!`,[["Make camp and wait it out (2 days)",()=>{adv(2);return "You huddle in the wagon until the "+n+" passes."}],["Press on through it",()=>{if(ch(.5)){const q=k=="food"?60+R(80):1+R(2),p=pk(A());lose(k,q);hurt(p,12+R(15),"the "+n);return `The ${n} batters you: you lose ${q} ${NM[k]} and ${p.n} is hurt.`}return "You get through, battered but whole."}]])}},
{w:4,f(){ask("You hear someone in the wagon at night: thieves!",[["Fire at them (1 box)",()=>{if(!G.ammo)return "No ammo! They take what they want.";lose("ammo",1);if(ch(.6))return "Your shot scares them off.";lose("food",80);return "They escape with 80 lb of food."}],["Let them go",()=>{const k=pk(["food","clothes","ammo","med"]),q=k=="food"?50+R(60):1;lose(k,q);return `They make off with ${q} ${NM[k]}.`}],["Chase them on foot (1 day)",()=>{adv(1);if(ch(.4)){G.money+=15;return "You recover the goods and a purse: +$15."}return "You lose them in the dark."}]])}},
{w:7,f(){const ks=Object.keys(U),a=pk(ks),b=pk(ks.filter(k=>k!=a)),qb=1+R(2),qa=Math.max(1,Math.round(qb*PR[b]/PR[a]*(.6+Math.random()*.8))),tq=q=>{if(G[a]<q*U[a])return "You don’t have enough to trade.";G[a]-=q*U[a];G[b]+=qb*U[b];return "Deal done."};
 ask(`${pk(["A trader","A weary emigrant","A fur trapper","A peddler"])} offers ${qb*U[b]} ${NM[b]} for ${qa*U[a]} ${NM[a]}.`,[["Accept",()=>tq(qa)],["Haggle",()=>ch(.5)?tq(Math.max(1,Math.floor(qa*.7))):"He shrugs and rides away."],["Decline",()=>"You wave him off."]])}},
{w:4,f(){ask(`A party of ${pk(["Pawnee","Lakota","Shoshone","Cayuse","Bannock"])} travelers approaches peacefully, offering to trade.`,[["Trade a set of clothes for guidance",()=>{if(!G.clothes)return "You have nothing to trade.";lose("clothes",1);G.mi+=20;return "They show you a better route: +20 miles."}],["Share a meal (−30 lb food)",()=>{lose("food",30);G.med++;return "They thank you with healing herbs: +1 medicine."}],["Nod and move on",()=>"They watch you go."]])}},
{w:5,f:hunt},
{w:4,f(){ask(`You find ${pk(["wild berries","mushrooms","a patch of wild onions","a plum thicket","prickly pear"])} near the trail.`,[["Gather and eat",()=>{if(ch(.2)){const p=pk(A());sick(p,"food poisoning",5);return "Some are bad! "+p.n+" falls ill with food poisoning."}G.food+=40+R(40);return "A welcome treat: extra food for the wagon."}],["Don’t risk it",()=>"Better safe than sorry."]])}},
